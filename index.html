    .roster-table-card{

  <script>
    const SUPABASE_URL_RAW = "https://dedcykelhdqwktkmkeiv.supabase.co";

    function emergencyShowError(message){const msg=String(message||"Unknown app error");console.error(msg);const login=document.getElementById("loginScreen"),app=document.getElementById("appScreen"),target=document.getElementById("message")||document.getElementById("loginMessage");if(app)app.classList.remove("hidden");if(login)login.classList.add("hidden");if(target)target.innerHTML=`<div class="error">App error: ${escapeHtml(msg)}</div>`;}
    window.addEventListener("error",e=>emergencyShowError(e.message||e.error));window.addEventListener("unhandledrejection",e=>emergencyShowError(e.reason?.message||e.reason));
    document.addEventListener("DOMContentLoaded",async()=>{const{data}=await sb.auth.getSession();appState.session=data.session;sb.auth.onAuthStateChange((_event,session)=>{appState.session=session;boot();});await boot();});
    async function boot(){clearMessage();if(!appState.session){showLogin();return;}await loadReferenceData();showApp();}

    function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appScreen").classList.remove("hidden");const p=appState.profile;if(!p){showError("Login succeeded, but no staff profile was returned for this account. Check the staff/user profile link in Supabase.");return;}const uname=p.full_name||p.email||"Signed in";document.getElementById("tabBarUser").innerHTML=uname.split(" ").filter(Boolean).map(w=>"<span class=\"name-letter\">"+escapeHtml(w)+"</span>").join("");const validTabs=getTabs().map(t=>t[0]);if(!appState.activeTab||!validTabs.includes(appState.activeTab))appState.activeTab=p.is_sno?"snoOverview":"wardDaily";buildTabs();renderTab(appState.activeTab);}
    async function loadReferenceData(){const{data,error}=await sb.rpc("get_app_reference_data");if(error){showError("Could not load app reference data: "+error.message);throw error;}let refData=data;if(typeof refData==="string"){try{refData=JSON.parse(refData);}catch(_e){}}if(Array.isArray(refData)){const first=refData[0]||{};refData=first.get_app_reference_data||first.result||first.data||first;}if(!refData||typeof refData!=="object")throw new Error("get_app_reference_data did not return a usable object.");appState.ref=refData||{};appState.profile=appState.ref.profile||appState.ref.user_profile||appState.ref.current_profile||null;if(!appState.profile)throw new Error("No user profile returned by get_app_reference_data.");if(!appState.profile.is_sno){const{data:snoVal}=await sb.rpc("get_my_is_sno");if(snoVal===true)appState.profile.is_sno=true;}const rawWards=appState.ref.accessible_wards||appState.ref.wards||[];appState.wards=rawWards.map(w=>({ward_id:w.ward_id||w.id,ward_code:w.ward_code||w.code||"",ward_name:w.ward_name||w.name||""})).filter(w=>w.ward_id);if(appState.wards.length>0){const stillValid=appState.wards.some(w=>w.ward_id===appState.selectedWardId);if(!appState.selectedWardId||!stillValid)appState.selectedWardId=appState.wards[0].ward_id;}}

    function getTabs(){if(appState.profile?.is_sno)return[["snoOverview","Today’s Overview"],["monthlyRoster","Monthly Roster"],["staffManagement","Staff Management"],["relievingPool","Relieving Pool"],["auditVisuals","Audit KPIs"],["auditHistory","Audit History"],["myAccount","My Account"]];const tabs=[["wardDaily","Daily Staffing"],["monthlyRoster","Monthly Roster"],["staffManagement","My Ward Staff"]];if(isChargeNurse())tabs.push(["changeOfDuty","Change of Duty"]);tabs.push(["myAccount","My Account"]);return tabs;}
    function tabIcon(key){const m={wardDaily:["#3b82f6","D"],monthlyRoster:["#8b5cf6","M"],staffManagement:["#10b981","S"],myAccount:["#f59e0b","A"],snoOverview:["#3b82f6","O"],relievingPool:["#06b6d4","R"],auditVisuals:["#f97316","K"],auditHistory:["#64748b","H"],changeOfDuty:["#f59e0b","C"]};const[bg,letter]=m[key]||["#94a3b8","-"];return`<span class="tab-icon" style="background:${bg}">${letter}</span>`;}

    function reloadCurrentTab(){renderTab(appState.activeTab);}async function signIn(){const email=document.getElementById("loginEmail").value.trim();const password=document.getElementById("loginPassword").value;setLoginMessage("");if(!email||!password){setLoginMessage(`<div class="error">Enter email and password.</div>`);return;}const{error}=await sb.auth.signInWithPassword({email,password});if(error){const msg=String(error.message||error);const detail=/Failed to fetch|fetch failed/i.test(msg)?(msg+" Could not reach Supabase at "+SUPABASE_URL+". Hard-refresh (Ctrl+F5) to reload the latest version."):msg;setLoginMessage(`<div class="error">${escapeHtml(detail)}</div>`);return;}}
    async function signOut(){await sb.auth.signOut();appState={session:null,ref:null,profile:null,wards:[],activeTab:null,selectedWardId:null,selectedDate:todayISO(),selectedMonth:monthISO(new Date()),selectedOverviewWardId:"",selectedRelievingWardId:"",selectedAuditWardId:"",selectedKpiStaffId:"",staffRows:[],monthlyRosterRows:[],monthlyExtraRows:[],dailyNonCoreRows:{}};showLogin();}

    async function renderSnoOverview(){const date=appState.selectedDate;const selectedWardFilter=appState.selectedOverviewWardId||"";const{data,error}=await sb.rpc("get_sno_daily_overview",{p_staffing_date:date});if(error)throw error;const rawRows=data||[];const byId=new Map(),byCode=new Map();rawRows.forEach(r=>{if(r.ward_id)byId.set(String(r.ward_id),r);if(r.ward_code)byCode.set(String(r.ward_code),r);});let rows=appState.wards.map(w=>byId.get(String(w.ward_id))||byCode.get(String(w.ward_code))||{ward_id:w.ward_id,ward_code:w.ward_code,ward_name:w.ward_name,ward_status:"not_submitted",required_nurses:0,required_carers:0,present_nurses:0,present_carers:0,present_healthcare_assistants:0,sick_total:0,leave_total:0,til_out_total:0,total_shortage:0});if(!rows.length)rows=rawRows;if(selectedWardFilter)rows=rows.filter(r=>String(r.ward_id||"")===String(selectedWardFilter));const full=rows.filter(r=>r.ward_status==="fully_staffed").length,short=rows.filter(r=>r.ward_status==="short_staffed").length,not=rows.filter(r=>r.ward_status==="not_submitted"||!r.ward_status).length;document.getElementById("content").innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between;align-items:flex-end"><div><h2>Today’s Overview</h2><p class="muted">All wards must submit daily staffing by 07:00.</p></div><div class="actions" style="align-items:flex-end">${overviewWardSelectorHtml()}<div><label>Date</label><input type="date" value="${date}" onchange="setSelectedDate(this.value)"></div></div></div></div><div class="stat-row-5" style="grid-template-columns:repeat(4,minmax(0,1fr))">${statCard(rows.length,"Total wards")}${statCard(full,"Fully staffed")}${statCard(short,"Short staffed")}${statCard(not,"Not submitted")}</div><div class="grid grid-3">${rows.map(r=>`<div class="card"><div class="actions" style="justify-content:space-between"><h3>${escapeHtml(r.ward_code||"—")}</h3>${wardStatusBadge(r.ward_status||"not_submitted")}</div><p class="muted">${escapeHtml(r.ward_name||"")}</p><table style="min-width:0"><tr><td>Required nurses</td><td><strong>${numberValue(r.required_nurses)}</strong></td></tr><tr><td>Required carers/aides</td><td><strong>${numberValue(r.required_carers)}</strong></td></tr><tr><td>Present nurses</td><td><strong>${numberValue(r.present_nurses)}</strong></td></tr><tr><td>Present carers/aides</td><td><strong>${numberValue(r.present_carers)+numberValue(r.present_healthcare_assistants)}</strong></td></tr><tr><td>Sick</td><td><strong>${numberValue(r.sick_total)}</strong></td></tr><tr><td>Leave</td><td><strong>${numberValue(r.leave_total)}</strong></td></tr><tr><td>Shortage</td><td><strong>${numberValue(r.total_shortage)}</strong></td></tr></table></div>`).join("")||`<div class="card"><p class="muted">No wards returned for this account.</p></div>`}</div>`;}
    async function renderWardDaily(){const wardId=requireSelectedWard();const date=appState.selectedDate;const[summaryResult,rosterResult,staffResult]=await Promise.all([sb.rpc("get_ward_daily_dashboard",{p_ward_id:wardId,p_staffing_date:date}),sb.rpc("get_my_ward_roster_between",{p_ward_id:wardId,p_start_date:date,p_end_date:date}),sb.rpc("get_ward_staff_members",{p_ward_id:wardId})]);if(summaryResult.error)throw summaryResult.error;if(rosterResult.error)throw rosterResult.error;const s=(summaryResult.data||[])[0],roster=rosterResult.data||[],w=selectedWard();const staffMap=new Map();for(const sm of(staffResult.data||[])){if(truthy(sm.is_active))staffMap.set(String(sm.id||sm.staff_id),sm);}const allStaffIds=new Set([...roster.map(r=>String(r.staff_id)),...staffMap.keys()]);const coreRows=[],ncRows=[],secondaryOtRows=[];for(const sid of allStaffIds){const r=roster.find(x=>String(x.staff_id)===sid)||null;const sm=staffMap.get(sid);if(!r&&!sm)continue;const si={roster_pattern_code:(r?.roster_pattern_code||sm?.roster_pattern_code||null),roster_start_date:dateOnly(r?.roster_start_date||sm?.roster_start_date)||null};const liveCode=normaliseRosterCode(r?.live_shift_code||"");const pat=baselineShiftCode(si,date,date);const isOv=!!liveCode;const live=liveCode||pat||"";const ent={staff_id:sid,full_name:r?.full_name||sm?.full_name||"",role:r?.role||sm?.role||"",isOverride:isOv,baselineCode:pat||r?.baseline_shift_code||"",liveCode:live,row:r};const isCore=staffMap.has(sid);if(isCore)coreRows.push(ent);else ncRows.push(ent);if(isCore){const secs=parseSecondaryCodes(r);for(const sec of secs){if(sec==="OT")secondaryOtRows.push({staff_id:sid,full_name:ent.full_name,role:ent.role,primaryCode:live});else if(sec)coreRows.push({staff_id:sid,full_name:ent.full_name,role:ent.role,isOverride:false,baselineCode:"",liveCode:sec,row:null,isSecondary:true});}}}const sf=(a,b)=>{const rd=roleSortOrder(a.role)-roleSortOrder(b.role);return rd!==0?rd:cleanStaffName(a.full_name).localeCompare(cleanStaffName(b.full_name));};coreRows.sort(sf);ncRows.sort(sf);const manNC=appState.dailyNonCoreRows[date]||[];if(!s&&coreRows.length===0&&ncRows.length===0&&manNC.length===0){document.getElementById("content").innerHTML="<div class=\"card\"><div class=\"info\">No dashboard summary returned for this ward/date.</div></div>";return;}const present=coreRows.filter(r=>!r.isSecondary&&["A","M","D"].includes(r.liveCode)).length,absent=coreRows.filter(r=>!r.isSecondary&&["O","R"].includes(r.liveCode)).length,sick=coreRows.filter(r=>!r.isSecondary&&r.liveCode==="SL").length,tilOut=coreRows.filter(r=>!r.isSecondary&&r.liveCode==="TO").length,otCnt=ncRows.length+manNC.filter(x=>x.type==="OT").length+secondaryOtRows.length,tilIn=manNC.filter(x=>x.type==="TIL_IN").length;const cTR=coreRows.map(r=>r.isSecondary?("<tr class=\"nc-row\"><td>"+escapeHtml(cleanStaffName(r.full_name))+"</td><td>"+escapeHtml(labelRole(r.role))+"</td><td>&mdash;</td><td>"+shiftBadge(r.liveCode)+" <span class=\"muted\" style=\"font-size:11px\">also working</span></td><td>Second shift (same day)</td></tr>"):("<tr><td>"+escapeHtml(cleanStaffName(r.full_name))+"</td><td>"+escapeHtml(labelRole(r.role))+"</td><td>"+shiftBadge(r.baselineCode)+"</td><td>"+shiftButton(r.staff_id,date,r.liveCode,r.isOverride,r.liveCode,r.row,false,true)+"</td><td>"+escapeHtml(r.row?.override_reason||"")+"</td></tr>")).join("");const ncTR=ncRows.map(r=>"<tr class=\"nc-row\"><td>"+escapeHtml(cleanStaffName(r.full_name))+"</td><td>"+escapeHtml(labelRole(r.role))+"</td><td>"+shiftBadge(r.baselineCode)+"</td><td>"+shiftButton(r.staff_id,date,r.liveCode,r.isOverride,r.liveCode,r.row)+"</td><td>"+escapeHtml(r.row?.override_reason||"")+"</td></tr>").join("");const mTR=manNC.map(x=>"<tr class=\"nc-row\"><td><strong>"+escapeHtml(x.name)+"</strong></td><td>"+(x.type==="OT"?"Overtime":x.type==="TIL_IN"?"TIL In":"TIL Out")+"</td><td>&mdash;</td><td>"+shiftBadge(x.type==="OT"?"OT":x.type==="TIL_IN"?"TI":"TO")+"</td><td>"+escapeHtml(x.startTime||"07:00")+" &ndash; "+escapeHtml(x.untilTime||"")+" <button type=\"button\" class=\"secondary small\" onclick=\"removeNonCore('"+date+"',"+x.id+")\">x</button></td></tr>").join("");const secOtTR=secondaryOtRows.map(r=>"<tr class=\"nc-row\"><td><strong>"+escapeHtml(cleanStaffName(r.full_name))+"</strong></td><td>"+escapeHtml(labelRole(r.role))+"</td><td>&mdash;</td><td>"+shiftBadge("OT")+"</td><td>"+escapeHtml(shiftLabel(r.primaryCode)||"Day")+" (day) &middot; Overtime night</td></tr>").join("");const ncSection=(ncRows.length||manNC.length||secondaryOtRows.length)?"<tr class=\"section-divider-row\"><td colspan=\"5\">Non-Core Staff &mdash; Overtime &amp; TIL</td></tr>"+ncTR+mTR+secOtTR:"";document.getElementById("content").innerHTML="<div class=\"card\"><div class=\"actions\" style=\"justify-content:space-between\"><div><h2>Daily Staffing</h2><h1 style=\"margin-bottom:4px\">"+escapeHtml(w?.ward_name||s?.ward_name||s?.ward_code||"")+"</h1><p class=\"muted\">"+escapeHtml(formatDate(date))+"</p></div><div class=\"actions\">"+wardSelectorHtml()+"<div><label>Date</label><input type=\"date\" value=\""+date+"\" onchange=\"setSelectedDate(this.value)\"></div></div></div></div><div class=\"daily-stat-row\">"+dailyStatCell(present,"Present")+dailyStatCell(absent,"Absent/Off")+dailyStatCell(sick,"Sick")+dailyStatCell(tilOut,"TIL Out")+dailyStatCell(otCnt,"OT")+dailyStatCell(tilIn,"TIL In")+"</div><div class=\"nc-btn-bar\"><button class=\"btn-ot\" type=\"button\" onclick=\"openNcModal('OT','"+date+"')\">+ Add OT Nurse</button><button class=\"btn-til\" type=\"button\" onclick=\"openNcModal('TIL_IN','"+date+"')\">+ TIL In</button><button class=\"btn-til\" type=\"button\" onclick=\"openNcModal('TIL_OUT','"+date+"')\">+ TIL Out</button></div><div class=\"card\"><div class=\"actions\" style=\"justify-content:space-between\"><div><h3>Establishment</h3><p class=\"muted\">Required: "+numberValue(s?.required_nurses)+" nurses + "+numberValue(s?.required_carers)+" carers/HCAs.</p></div><button class=\"success\" type=\"button\" onclick=\"submitDailyStaffing()\">Submit to SNO and Nurse HR</button></div></div><div class=\"card\"><div class=\"table-wrap\"><table><thead><tr><th>Staff</th><th>Role</th><th>Baseline</th><th>Live</th><th>Notes</th></tr></thead><tbody><tr class=\"section-divider-row\"><td colspan=\"5\">Core Staff</td></tr>"+(cTR||"<tr><td colspan=\"5\" class=\"muted\">No core staff found.</td></tr>")+ncSection+"</tbody></table></div></div>";}
    let _ncModalType=null;
    function openNcModal(type,defaultDate){
      _ncModalType=type;
      const isOt=type==="OT";
      document.getElementById("ncModalTitle").textContent=isOt?"Add Overtime Nurse":type==="TIL_IN"?"Add TIL In":"Add TIL Out";

      if (rosterResult.error) throw rosterResult.error;
      if (holidayResult.error) throw holidayResult.error;

      // Group roster rows by staff
      const grouped = groupRosterByStaff(rosterResult.data || []);
      const holidays = holidayResult.data || [];

      // Merge active staff who have no roster rows yet

    // TEMPORARY DIAGNOSTIC — verifies whether a roster save actually persisted.
    // After an upsert it (1) shows what the RPC returned, (2) reads the
    // roster_overrides table directly, and (3) re-reads via the roster RPC.
    // Open the browser console (F12) to see [ROSTER-DIAG] output.
    async function diagnoseRosterSave(staffId,shiftDate,shiftCode,rpcData){
      const out={staffId,shiftDate,sentShiftCode:shiftCode,ward:appState.selectedWardId,rpcReturned:rpcData??null};
      try{
        const{data:tbl,error:tblErr}=await sb.from("roster_overrides")
          .select("shift_date,staff_id,ward_id,live_shift_code,override_reason,notes,is_cancelled,created_at")
          .eq("ward_id",appState.selectedWardId).eq("staff_id",staffId);
        out.tableRowsForStaff=tblErr?("ERROR: "+tblErr.message):(tbl||[]);
        out.tableRowForThisDate=Array.isArray(tbl)?tbl.filter(r=>dateOnly(r.shift_date)===shiftDate):"n/a";
      }catch(e){out.tableRowsForStaff="EXCEPTION: "+e.message;}
      try{
        const{data:rpc,error:rpcErr}=await sb.rpc("get_my_ward_roster_between",
          {p_ward_id:appState.selectedWardId,p_start_date:shiftDate,p_end_date:shiftDate});
        out.rosterRpcRows=rpcErr?("ERROR: "+rpcErr.message):(rpc||[]).filter(r=>String(r.staff_id)===String(staffId));
      }catch(e){out.rosterRpcRows="EXCEPTION: "+e.message;}
      console.log("%c[ROSTER-DIAG]","color:#fff;background:#7c3aed;padding:2px 6px;border-radius:4px;font-weight:bold",out);
      const tableHas=Array.isArray(out.tableRowForThisDate)&&out.tableRowForThisDate.length>0;
      const rpcHas=Array.isArray(out.rosterRpcRows)&&out.rosterRpcRows.some(r=>r.live_shift_code);
      let verdict,color;
      if(!tableHas){verdict="Write did NOT persist to roster_overrides (server-side: upsert_ward_roster_override RPC or RLS is blocking the insert).";color="#dc2626";}
      else if(!rpcHas){verdict="Row IS saved in roster_overrides, but get_my_ward_roster_between does NOT return it (server-side: the read RPC isn't joining overrides).";color="#d97706";}
      else{verdict="Saved AND read back correctly. If the cell still reverts, it's a display issue — tell Claude.";color="#16a34a";}
      out.verdict=verdict;
      const el=document.getElementById("message");
      if(el)el.innerHTML=`<div style="background:${color};color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4"><strong>Save diagnostic:</strong> ${escapeHtml(verdict)}<br><span style="opacity:.85;font-size:12px">Full details in browser console (F12 → Console → look for [ROSTER-DIAG]). Copy that and send it to Claude.</span></div>`;
      return out;
    }

    async function saveDayCard(){
      if(!dayCardState)return;
      const state=dayCardState;
      const mainEntry=state.entries[0];
      const mainCode=normaliseRosterCode(mainEntry?.code||"");
      if(!mainCode){showError("Please choose a day shift from the first row.");return;}
      if(mainCode==="LL"){showError("Long Leave is automatic. Select Leave and the system shows LL after 3 consecutive days.");return;}
      const allowed=new Set(SHIFT_PICKER_CHOICES.map(x=>x.code));
      if(!allowed.has(mainCode)){showError("Select a valid shift for the day row.");return;}
      if(isCodCode(mainCode)&&!mainEntry.codDate){showError("Choose the vice date for COD-in/COD-off (first row).");return;}
      // Validate extras
      const extraCodes=[];
      for(let i=1;i<state.entries.length;i++){
        const ec=normaliseRosterCode(state.entries[i].code||"");
        if(!ec)continue;
        if(!allowed.has(ec)){showError(`Entry ${i+1}: choose a valid shift code.`);return;}
        if(isCodCode(ec)){showError(`Entry ${i+1}: COD-in/COD-off can only be set on the first (day) row, where its vice date is recorded. Use the first row for a change of duty.`);return;}
        extraCodes.push(ec);
      }
      // Safety: enforce rest gap between night and day across adjacent days
      const staffForCheck=findMonthlyStaff(state.staffId);
      const safetyIssue=shiftSafetyIssue(staffForCheck,state.shiftDate,[mainCode,...extraCodes]);
      if(safetyIssue){const w=document.getElementById("dayCardWarn");if(w){w.textContent="⛔ "+safetyIssue;w.style.display="block";}return;}
      let notes=null;
      // Attach COD vice date to main notes if needed
      if(isCodCode(mainCode)&&mainEntry.codDate)notes=notes?`${notes} | vice ${mainEntry.codDate}`:`vice ${mainEntry.codDate}`;
      // Encode extra codes as tokens
      notes=withSecondaryTokens(notes,extraCodes);
      // Encode from-to hours for main entry (only when both sides present, and code allows manual timing)
      if(mainEntry.time&&!CODES_AUTO_ICON.has(mainCode)){const[tf,tt]=mainEntry.time.split("-");if(tf!==""&&tt!=="")notes=(notes?notes+" ":"")+`[TIME:${tf}-${tt}]`;}
      closeDayCard();
      const shiftCode=storeRosterCode(mainCode);
      const{data:saveData,error:saveErr}=await sb.rpc("upsert_ward_roster_override",{
        p_ward_id:appState.selectedWardId,
        p_staff_id:state.staffId,
        p_shift_date:state.shiftDate,
        p_shift_code:shiftCode,
        p_override_reason:reasonForShift(shiftCode),
        p_notes:notes
      });
      if(saveErr){showError("Save failed: "+saveErr.message);return;}
      await diagnoseRosterSave(state.staffId,state.shiftDate,shiftCode,saveData);
      // Patch in-memory and update the whole row in the DOM
      if(appState.monthlyRosterRows){
        const sr=appState.monthlyRosterRows.find(r=>String(r.staff_id)===String(state.staffId));
        if(sr){
          if(!sr.days[state.shiftDate])sr.days[state.shiftDate]={};
          sr.days[state.shiftDate].live_shift_code=shiftCode;
          sr.days[state.shiftDate].source_type="override";
          sr.days[state.shiftDate].override_notes=notes;
          const{start,days}=monthRange(appState.selectedMonth);
          const resolvedMap=buildResolvedCodeMap(sr,days,start);
          for(const d of days){
            const k=isoFromDate(d);
            const td=document.getElementById("rc-"+state.staffId+"-"+k);

function legend(code,label){return`<span class="legend-item" onclick="toggleLegendHighlight('${escapeHtml(code)}')" title="Click to highlight ${escapeHtml(label)} cells">${shiftBadge(code)} <span class="muted">${escapeHtml(label)}</span></span>`;}function toggleLegendHighlight(code){const clean=normaliseRosterCode(code)||code;const items=document.querySelectorAll(".legend-item");const cells=document.querySelectorAll(".roster-table td:not(:first-child)");const alreadyActive=document.querySelector(`.legend-item.legend-active[data-code="${CSS.escape(clean)}"]`);items.forEach(el=>el.classList.remove("legend-active"));cells.forEach(td=>td.classList.remove("legend-dim","legend-lit"));if(alreadyActive){return;}const activeItem=Array.from(items).find(el=>el.querySelector(`.shift-${CSS.escape(clean)}`));if(activeItem){activeItem.classList.add("legend-active");activeItem.setAttribute("data-code",clean);}cells.forEach(td=>{const btn=td.querySelector(".shift-cell");const cellCode=btn?normaliseRosterCode((btn.className.match(/shift-([A-Z0-9]+)/)||[])[1]||""):"";if(cellCode===clean){td.classList.add("legend-lit");}else{td.classList.add("legend-dim");}});}
    function groupRosterByStaff(rows){const map=new Map();for(const row of rows){if(!map.has(row.staff_id)){map.set(row.staff_id,{staff_id:row.staff_id,full_name:row.full_name,role:row.role,roster_group:row.roster_group,roster_code:row.roster_code,roster_name:row.roster_name,roster_pattern_code:row.roster_pattern_code,roster_start_date:row.roster_start_date||null,days:{}});}map.get(row.staff_id).days[dateOnly(row.shift_date)]=row;}return Array.from(map.values()).sort((a,b)=>{const rd=roleSortOrder(a.role)-roleSortOrder(b.role);return rd!==0?rd:cleanStaffName(a.full_name).localeCompare(cleanStaffName(b.full_name));});}function patternShiftForDate(pattern,startIso,targetIso){if(!pattern||!startIso||!targetIso)return"";const s=new Date(startIso),t=new Date(targetIso);s.setHours(0,0,0,0);t.setHours(0,0,0,0);const diff=Math.round((t-s)/(864e5));if(diff<0)return"";return pattern[diff%pattern.length]||"";}function baselineShiftCode(staff,isoDate,fallbackStart){if(!staff.roster_pattern_code)return"";const start=staff.roster_start_date||fallbackStart||isoDate;return patternShiftForDate(staff.roster_pattern_code,start,isoDate);}
    function requireSelectedWard(){if(!appState.selectedWardId)throw new Error("No ward selected or no ward access was returned for this account.");return appState.selectedWardId;}function selectedWard(){return appState.wards.find(w=>w.ward_id===appState.selectedWardId)||null;}function wardAccessLabel(){if(!appState.wards.length)return"No ward access returned";return`Access: ${appState.wards.map(w=>w.ward_name?`${w.ward_name} (${w.ward_code})`:w.ward_code).join(", ")}`;}function monthRange(monthValue){const[y,m]=monthValue.split("-").map(Number),startDate=new Date(y,m-1,1),endDate=new Date(y,m,0),days=[],cursor=new Date(startDate);while(cursor<=endDate){days.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);}return{start:isoFromDate(startDate),end:isoFromDate(endDate),days};}function cleanStaffName(name){return String(name||"").replace(/^SW\d+\s+/i,"").replace(/^SAU1\s+/i,"").replace(/\s+/g," ").trim();}function buildFullName(surname,firstName){return [String(surname||"").trim(),String(firstName||"").trim()].filter(Boolean).join(" ");}function splitStaffName(fullName){const clean=cleanStaffName(fullName),parts=clean.split(/\s+/).filter(Boolean);if(parts.length===0)return{surname:"",firstName:""};if(parts.length===1)return{surname:parts[0],firstName:""};return{surname:parts[0],firstName:parts.slice(1).join(" ")};}function todayISO(){return isoFromDate(new Date());}function monthISO(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0");return`${y}-${m}`;}function isoFromDate(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return`${y}-${m}-${d}`;}function dateOnly(value){if(!value)return"";return String(value).slice(0,10);}function formatDate(value){if(!value)return"";const[y,m,d]=String(value).split("-");return`${d}/${m}/${y}`;}function formatDateTime(value){if(!value)return"";const dt=new Date(value);return dt.toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}function shortDateTime(value){if(!value)return"";const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}function weekdayShort(date){return date.toLocaleDateString("en-GB",{weekday:"short"});}function monthLabel(monthValue){const[y,m]=monthValue.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});}function labelRole(role){const labels={sno:"Senior Nursing Officer",charge_nurse:"Charge Nurse",senior_staff_nurse:"Senior Staff Nurse",nurse:"Staff Nurse",nursing_aide:"Nursing Aide",healthcare_assistant:"Nursing Aide",carer:"Carer"};return labels[role]||role||"";}function roleSortOrder(role){const order={sno:0,charge_nurse:1,senior_staff_nurse:2,nurse:3,nursing_aide:4,healthcare_assistant:4,carer:5};return order[role]??99;}function reasonForShift(code){const clean=normaliseRosterCode(code),map={AL:"leave",L:"leave",SL:"sick_leave",ML:"maternity_leave",ST:"study_leave",TI:"til_in",TO:"til_out",CODI:"manual_roster_change",CODO:"manual_roster_change",OT:"overtime",O:"off",R:"rest",LL:"long_leave",A:"manual_day_change",D:"manual_day_change",N:"manual_night_change",M:"manual_morning_change",E:"manual_evening_change"};return map[clean]||"manual_roster_change";}function numberValue(value){const n=Number(value);return Number.isFinite(n)?n:0;}function truthy(value){return value===true||value==="true"||value===1||value==="1";}function safeKey(value){return String(value||"").replace(/[^a-zA-Z0-9]/g,"_");}function showError(message){document.getElementById("message").innerHTML=`<div class="error">${escapeHtml(message)}</div>`;}function showSuccess(message){document.getElementById("message").innerHTML=`<div class="success-msg">${escapeHtml(message)}</div>`;}function clearMessage(){const el=document.getElementById("message");if(el)el.innerHTML="";}function setLoginMessage(html){document.getElementById("loginMessage").innerHTML=html;}function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
    /* ---- Staff Profile Modal JS (SNO only) ---- */
    function closeProfileModal(){document.getElementById("profileBackdrop").classList.add("hidden");}
    async function openStaffProfile(staffId,fullName,role){
      if(!appState.profile?.is_sno)return;
      const backdrop=document.getElementById("profileBackdrop");
      const body=document.getElementById("profileModalBody");
      document.getElementById("profileModalName").textContent=fullName||"Staff member";
      document.getElementById("profileModalRole").textContent=labelRole(role)||"";
      body.innerHTML=`<p class="muted" style="text-align:center;padding:20px 0">Loading...</p>`;
      backdrop.classList.remove("hidden");
      // fetch last 12 months of overrides for this staff member
      const endDate=todayISO();
      const startD=new Date();startD.setFullYear(startD.getFullYear()-1);
      const startDate=isoFromDate(startD);
      const{data:rows,error}=await sb.from("roster_overrides")
        .select("shift_date,live_shift_code,source_type,override_reason,created_at")
        .eq("staff_id",staffId).eq("is_cancelled",false)
        .gte("shift_date",startDate).lte("shift_date",endDate)
        .order("shift_date",{ascending:false});
      if(error){body.innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`;return;}
      const all=rows||[];
      const leaveRows=all.filter(r=>["L","SL","ML","ST","LL"].includes(normaliseRosterCode(r.live_shift_code)));
      const otRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="OT");
      const tilInRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="TI");
      const tilOutRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="TO");
      const slRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="SL");
      function historyRows(list){if(!list.length)return`<tr><td colspan="3" class="muted" style="text-align:center">No records</td></tr>`;return list.slice(0,20).map(r=>`<tr><td>${escapeHtml(formatDate(r.shift_date))}</td><td>${shiftBadge(r.live_shift_code)}</td><td>${escapeHtml(r.override_reason||r.source_type||"")}</td></tr>`).join("");}
      body.innerHTML=`
        <div class="profile-stats-grid">
          <div class="profile-stat"><div class="profile-stat-value">${leaveRows.length}</div><div class="profile-stat-label">Leave days</div></div>
          <div class="profile-stat"><div class="profile-stat-value">${slRows.length}</div><div class="profile-stat-label">Sick days</div></div>
          <div class="profile-stat"><div class="profile-stat-value">${otRows.length}</div><div class="profile-stat-label">OT shifts</div></div>
          <div class="profile-stat"><div class="profile-stat-value">${tilOutRows.length}</div><div class="profile-stat-label">TIL out</div></div>
        </div>
        <div class="profile-section">
          <div class="profile-section-title">Leave history (last 12 months)</div>
          <div style="border:1px solid #e2e8f0;border-radius:12px;overflow:hidden"><table class="profile-history-table"><thead><tr><th>Date</th><th>Type</th><th>Reason</th></tr></thead><tbody>${historyRows(leaveRows)}</tbody></table></div>
        </div>
        <div class="profile-section">
          <div class="profile-section-title">Overtime history</div>
          <div style="border:1px solid #e2e8f0;border-radius:12px;overflow:hidden"><table class="profile-history-table"><thead><tr><th>Date</th><th>Type</th><th>Reason</th></tr></thead><tbody>${historyRows(otRows)}</tbody></table></div>
        </div>
        <div class="profile-section" style="margin-bottom:0">
          <div class="profile-section-title">TIL history</div>
          <div style="border:1px solid #e2e8f0;border-radius:12px;overflow:hidden"><table class="profile-history-table"><thead><tr><th>Date</th><th>Type</th><th>Reason</th></tr></thead><tbody>${historyRows([...tilInRows,...tilOutRows].sort((a,b)=>b.shift_date.localeCompare(a.shift_date)))}</tbody></table></div>
        </div>`;
    }
    // Full-page staff profile rendered in-app (SNO + charge nurses)
    async function openStaffProfilePage(staffId){
      if(!(appState.profile?.is_sno||isChargeNurse()))return;
      clearMessage();
      const sr=(appState.monthlyRosterRows||[]).find(r=>String(r.staff_id)===String(staffId));
      const fullName=sr?cleanStaffName(sr.full_name):"Staff member";
      const role=sr?sr.role:"";
      const content=document.getElementById("content");
      content.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#1e3a5f,#2f6fae);color:#fff"><div class="actions" style="justify-content:space-between;align-items:flex-start"><div><h2 style="color:#fff;margin:0 0 4px">${escapeHtml(fullName)}</h2><p style="margin:0;opacity:.85;font-weight:600">${escapeHtml(labelRole(role)||"")}${sr&&sr.roster_pattern_code?` · Pattern ${escapeHtml(staffRosterLabel(sr))}`:""}</p></div><button type="button" class="secondary" onclick="renderMonthlyRoster()">← Back to roster</button></div></div><div id="ppBody"><div class="card"><p class="muted">Loading profile…</p></div></div>`;
      const endDate=todayISO();const startD=new Date();startD.setFullYear(startD.getFullYear()-1);const startDate=isoFromDate(startD);
      const{data:rows,error}=await sb.from("roster_overrides").select("shift_date,live_shift_code,source_type,override_reason,created_at").eq("staff_id",staffId).eq("is_cancelled",false).gte("shift_date",startDate).lte("shift_date",endDate).order("shift_date",{ascending:false});
      const body=document.getElementById("ppBody");if(!body)return;
      if(error){body.innerHTML=`<div class="card"><div class="error">${escapeHtml(error.message)}</div></div>`;return;}
      const all=rows||[];
      const leaveRows=all.filter(r=>["L","SL","ML","ST","LL"].includes(normaliseRosterCode(r.live_shift_code)));
      const otRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="OT");
      const tilInRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="TI");
      const tilOutRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="TO");
      const slRows=all.filter(r=>normaliseRosterCode(r.live_shift_code)==="SL");
      const hr=list=>!list.length?`<tr><td colspan="3" class="muted" style="text-align:center">No records</td></tr>`:list.slice(0,40).map(r=>`<tr><td>${escapeHtml(formatDate(r.shift_date))}</td><td>${shiftBadge(r.live_shift_code)}</td><td>${escapeHtml(r.override_reason||r.source_type||"")}</td></tr>`).join("");
      const sect=(title,list)=>`<div class="card"><h3>${escapeHtml(title)}</h3><div class="table-wrap"><table class="mini-table"><thead><tr><th>Date</th><th>Type</th><th>Reason</th></tr></thead><tbody>${hr(list)}</tbody></table></div></div>`;
      body.innerHTML=`<div class="stat-row-5" style="grid-template-columns:repeat(4,minmax(0,1fr))">${statCard(leaveRows.length,"Leave days")}${statCard(slRows.length,"Sick days")}${statCard(otRows.length,"OT shifts")}${statCard(tilOutRows.length,"TIL out")}</div>${sect("Leave history (last 12 months)",leaveRows)}${sect("Overtime history",otRows)}${sect("TIL history",[...tilInRows,...tilOutRows].sort((a,b)=>b.shift_date.localeCompare(a.shift_date)))}`;
    }
  </script>

        <h2 id="profileModalName">Staff member</h2>
        <div class="profile-role" id="profileModalRole"></div>
      </div>
      <div class="profile-modal-body" id="profileModalBody"></div>
    </div>
