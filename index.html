    /* =========================================================
       MDH SURGICAL STAFFING — PROFESSIONAL MONTHLY ROSTER GRID — WIDER SPACED VERSION
       Full replacement styling: wider readable date boxes, clear grid,
       dark professional header, and compact but legible shift cells.
       ========================================================= */
    .roster-table-card{
      margin-left:calc(50% - 50vw + 8px)!important;
      margin-right:calc(50% - 50vw + 8px)!important;
      padding:10px!important;
      border-radius:16px!important;
      background:#ffffff!important;
    }

    .roster-table-wrap{

      max-width:100%!important;
      overflow-x:auto!important;
      overflow-y:visible!important;
      border:1px solid #94a3b8!important;
      border-radius:16px!important;
      background:#ffffff!important;
      box-shadow:0 8px 24px rgba(15,23,42,.07)!important;
      padding:12px!important;
    }

    .roster-table{
      width:max-content!important;
      min-width:2250px!important;
      margin:0 auto!important;
      table-layout:fixed!important;
      border-collapse:separate!important;
      border-spacing:0!important;

    }

    const SUPABASE_URL_RAW = "https://dedcykelhdqwktkmkeiv.supabase.co";

    function emergencyShowError(message){const msg=String(message||"Unknown app error");console.error(msg);const login=document.getElementById("loginScreen"),app=document.getElementById("appScreen"),target=document.getElementById("message")||document.getElementById("loginMessage");if(app)app.classList.remove("hidden");if(login)login.classList.add("hidden");if(target)target.innerHTML=`<div class="error">App error: ${escapeHtml(msg)}</div>`;}

    document.addEventListener("DOMContentLoaded",async()=>{const{data}=await sb.auth.getSession();appState.session=data.session;sb.auth.onAuthStateChange((_event,session)=>{appState.session=session;boot();});await boot();});
    async function boot(){clearMessage();if(!appState.session){showLogin();return;}await loadReferenceData();showApp();}
    function showLogin(){document.getElementById("loginScreen").classList.remove("hidden");document.getElementById("appScreen").classList.add("hidden");document.getElementById("topUser").textContent="Not signed in";}

    async function loadReferenceData(){const{data,error}=await sb.rpc("get_app_reference_data");if(error){showError("Could not load app reference data: "+error.message);throw error;}let refData=data;if(typeof refData==="string"){try{refData=JSON.parse(refData);}catch(_e){}}if(Array.isArray(refData)){const first=refData[0]||{};refData=first.get_app_reference_data||first.result||first.data||first;}if(!refData||typeof refData!=="object")throw new Error("get_app_reference_data did not return a usable object.");appState.ref=refData||{};appState.profile=appState.ref.profile||appState.ref.user_profile||appState.ref.current_profile||null;if(!appState.profile)throw new Error("No user profile returned by get_app_reference_data.");const rawWards=appState.ref.accessible_wards||appState.ref.wards||[];appState.wards=rawWards.map(w=>({ward_id:w.ward_id||w.id,ward_code:w.ward_code||w.code||"",ward_name:w.ward_name||w.name||""})).filter(w=>w.ward_id);if(appState.wards.length>0){const stillValid=appState.wards.some(w=>w.ward_id===appState.selectedWardId);if(!appState.selectedWardId||!stillValid)appState.selectedWardId=appState.wards[0].ward_id;}}

    async function renderTab(tabKey){appState.activeTab=tabKey;buildTabs();clearMessage();document.getElementById("content").innerHTML=`<div class="card"><p class="muted">Loading...</p></div>`;try{if(tabKey==="snoOverview")await renderSnoOverview();else if(tabKey==="wardDaily")await renderWardDaily();else if(tabKey==="monthlyRoster")await renderMonthlyRoster();else if(tabKey==="staffManagement")await renderStaffManagement();else if(tabKey==="relievingPool")await renderRelievingPool();else if(tabKey==="auditVisuals")await renderAuditVisuals();else if(tabKey==="auditHistory")await renderAuditHistory();else if(tabKey==="myAccount")await renderMyAccount();}catch(err){showError(err.message||String(err));}}

    async function renderSnoOverview(){const date=appState.selectedDate;const selectedWardFilter=appState.selectedOverviewWardId||"";const{data,error}=await sb.rpc("get_sno_daily_overview",{p_staffing_date:date});if(error)throw error;const rawRows=data||[];const byId=new Map(),byCode=new Map();rawRows.forEach(r=>{if(r.ward_id)byId.set(String(r.ward_id),r);if(r.ward_code)byCode.set(String(r.ward_code),r);});let rows=appState.wards.map(w=>byId.get(String(w.ward_id))||byCode.get(String(w.ward_code))||{ward_id:w.ward_id,ward_code:w.ward_code,ward_name:w.ward_name,ward_status:"not_submitted",required_nurses:0,required_carers:0,present_nurses:0,present_carers:0,present_healthcare_assistants:0,sick_total:0,leave_total:0,til_out_total:0,total_shortage:0});if(!rows.length)rows=rawRows;if(selectedWardFilter)rows=rows.filter(r=>String(r.ward_id||"")===String(selectedWardFilter));const full=rows.filter(r=>r.ward_status==="fully_staffed").length,short=rows.filter(r=>r.ward_status==="short_staffed").length,not=rows.filter(r=>r.ward_status==="not_submitted"||!r.ward_status).length;document.getElementById("content").innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between;align-items:flex-end"><div><h2>Today’s Overview</h2><p class="muted">All wards must submit daily staffing by 07:00.</p></div><div class="actions" style="align-items:flex-end">${overviewWardSelectorHtml()}<div><label>Date</label><input type="date" value="${date}" onchange="setSelectedDate(this.value)"></div></div></div></div><div class="stat-grid">${statCard(rows.length,"Total wards")}${statCard(full,"Fully staffed")}${statCard(short,"Short staffed")}${statCard(not,"Not submitted")}</div><div class="grid grid-3">${rows.map(r=>`<div class="card"><div class="actions" style="justify-content:space-between"><h3>${escapeHtml(r.ward_code||"—")}</h3>${wardStatusBadge(r.ward_status||"not_submitted")}</div><p class="muted">${escapeHtml(r.ward_name||"")}</p><table style="min-width:0"><tr><td>Required nurses</td><td><strong>${numberValue(r.required_nurses)}</strong></td></tr><tr><td>Required carers/aides</td><td><strong>${numberValue(r.required_carers)}</strong></td></tr><tr><td>Present nurses</td><td><strong>${numberValue(r.present_nurses)}</strong></td></tr><tr><td>Present carers/aides</td><td><strong>${numberValue(r.present_carers)+numberValue(r.present_healthcare_assistants)}</strong></td></tr><tr><td>Sick</td><td><strong>${numberValue(r.sick_total)}</strong></td></tr><tr><td>Leave</td><td><strong>${numberValue(r.leave_total)}</strong></td></tr><tr><td>Shortage</td><td><strong>${numberValue(r.total_shortage)}</strong></td></tr></table></div>`).join("")||`<div class="card"><p class="muted">No wards returned for this account.</p></div>`}</div>`;}
    async function renderWardDaily(){const wardId=requireSelectedWard();const date=appState.selectedDate;const[summaryResult,rosterResult]=await Promise.all([sb.rpc("get_ward_daily_dashboard",{p_ward_id:wardId,p_staffing_date:date}),sb.rpc("get_my_ward_roster_between",{p_ward_id:wardId,p_start_date:date,p_end_date:date})]);if(summaryResult.error)throw summaryResult.error;if(rosterResult.error)throw rosterResult.error;const s=(summaryResult.data||[])[0],roster=rosterResult.data||[],w=selectedWard();if(!s){document.getElementById("content").innerHTML=`<div class="card"><div class="info">No dashboard summary returned for this ward/date.</div></div>`;return;}document.getElementById("content").innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Ward Dashboard</h2><h1 style="margin-bottom:4px">${escapeHtml(w?.ward_name||s.ward_name||s.ward_code)}</h1><p class="muted">${escapeHtml(formatDate(date))}</p></div><div class="actions">${wardSelectorHtml()}<div><label>Date</label><input type="date" value="${date}" onchange="setSelectedDate(this.value)"></div></div></div></div><div class="stat-grid">${statCard(numberValue(s.present_nurses)+numberValue(s.present_carers)+numberValue(s.present_healthcare_assistants),"Present")}${statCard(numberValue(s.absent_total),"Absent / Off / Leave")}${statCard(numberValue(s.sick_total),"Sick")}${statCard(numberValue(s.til_out_total),"TIL out")}</div><div class="card"><div class="actions" style="justify-content:space-between"><div><h3>Establishment</h3><p class="muted">Required: ${numberValue(s.required_nurses)} nurses + ${numberValue(s.required_carers)} carers/HCAs. Nurse shortage: ${numberValue(s.nurse_shortage)}. Carer/HCA shortage: ${numberValue(s.carer_hca_shortage)}.</p></div><button class="success" type="button" onclick="submitDailyStaffing()">Submit to SNO and Nurse HR</button></div></div><div class="card"><h3>Staff rows</h3><div class="table-wrap"><table><thead><tr><th>Staff</th><th>Role</th><th>Baseline</th><th>Live</th><th>Reason</th></tr></thead><tbody>${roster.map(r=>`<tr><td>${escapeHtml(cleanStaffName(r.full_name))}</td><td>${escapeHtml(labelRole(r.role))}</td><td>${shiftBadge(r.baseline_shift_code)}</td><td>${shiftButton(r.staff_id,r.shift_date,r.live_shift_code,r.source_type==="override")}</td><td>${escapeHtml(r.override_reason||"")}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No staff rows found.</td></tr>`}</tbody></table></div></div>`;}
    async function submitDailyStaffing(){clearMessage();const{error}=await sb.rpc("create_daily_staffing_submission",{p_ward_id:appState.selectedWardId,p_staffing_date:appState.selectedDate,p_submitted_by_staff_id:null,p_notes:"Submitted from frontend"});if(error){showError(error.message);return;}showSuccess("Daily staffing submitted to SNO and Nurse HR workflow.");await renderWardDaily();}

    async function renderMonthlyRoster(){const wardId=requireSelectedWard();const monthValue=appState.selectedMonth;const{start,end,days}=monthRange(monthValue);const selectedW=selectedWard();const[rosterResult,holidayResult]=await Promise.all([sb.rpc("get_my_ward_roster_between",{p_ward_id:wardId,p_start_date:start,p_end_date:end}),sb.rpc("get_malta_public_holidays",{p_start_date:start,p_end_date:end})]);if(rosterResult.error)throw rosterResult.error;if(holidayResult.error)throw holidayResult.error;const grouped=groupRosterByStaff(rosterResult.data||[]),holidays=holidayResult.data||[];appState.monthlyRosterRows=grouped;const holidayMap={};for(const h of holidays)holidayMap[h.holiday_date]=h;document.getElementById("content").innerHTML=`<div class="card roster-hero"><div class="actions" style="justify-content:space-between;align-items:flex-start"><div><h2>Monthly Roster</h2><h1>${escapeHtml(selectedW?.ward_name||"Selected Ward")}</h1><p class="muted">${escapeHtml(selectedW?.ward_code||"")} · ${escapeHtml(monthLabel(monthValue))} · Click any shift cell to change status</p></div><div class="roster-nav">${wardSelectorHtml()}<div><label>Month</label><input type="month" value="${monthValue}" onchange="setSelectedMonth(this.value)"></div><div><label>Jump to date</label><input id="rosterJumpDate" type="date"></div><button class="secondary" type="button" onclick="jumpRosterDate()">Jump</button><button class="secondary" type="button" onclick="changeRosterMonth(-1)">← Prev</button><button class="secondary" type="button" onclick="goRosterToday()">Today</button><button class="secondary" type="button" onclick="changeRosterMonth(1)">Next →</button></div></div></div><div class="card"><div class="legend-compact">${legend("D","Day")}${legend("N","Night")}${legend("O","Off")}${legend("R","Rest")}${legend("L","Leave")}${legend("SL","Sick Leave")}${legend("ML","Maternity")}${legend("ST","Study")}${legend("TI","TIL In")}${legend("TO","TIL Out")}${legend("OT","Overtime")}${legend("LL","L     function groupRosterByStaff(rows){const map=new Map();for(const row of rows){if(!map.has(row.staff_id)){map.set(row.staff_id,{staff_id:row.staff_id,full_name:row.full_name,role:row.role,roster_group:row.roster_group,roster_code:row.roster_code,roster_name:row.roster_name,roster_pattern_code:row.roster_pattern_code,days:{}});}map.get(row.staff_id).days[row.shift_date]=row;}return Array.from(map.values()).sort((a,b)=>{const rd=roleSortOrder(a.role)-roleSortOrder(b.role);return rd!==0?rd:cleanStaffName(a.full_name).localeCompare(cleanStaffName(b.full_name));});}
    function requireSelectedWard(){if(!appState.selectedWardId)throw new Error("No ward selected or no ward access was returned for this account.");return appState.selectedWardId;}function selectedWard(){return appState.wards.find(w=>w.ward_id===appState.selectedWardId)||null;}function wardAccessLabel(){if(!appState.wards.length)return"No ward access returned";return`Access: ${appState.wards.map(w=>w.ward_name?`${w.ward_name} (${w.ward_code})`:w.ward_code).join(", ")}`;}function monthRange(monthValue){const[y,m]=monthValue.split("-").map(Number),startDate=new Date(y,m-1,1),endDate=new Date(y,m,0),days=[],cursor=new Date(startDate);while(cursor<=endDate){days.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);}return{start:isoFromDate(startDate),end:isoFromDate(endDate),days};}function cleanStaffName(name){return String(name||"").replace(/^SW\d+\s+/i,"").replace(/^SAU1\s+/i,"").replace(/\s+/g," ").trim();}function todayISO(){return isoFromDate(new Date());}function monthISO(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0");return`${y}-${m}`;}function isoFromDate(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return`${y}-${m}-${d}`;}function dateOnly(value){if(!value)return"";return String(value).slice(0,10);}function formatDate(value){if(!value)return"";const[y,m,d]=String(value).split("-");return`${d}/${m}/${y}`;}function formatDateTime(value){if(!value)return"";const dt=new Date(value);return dt.toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}function shortDateTime(value){if(!value)return"";const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}function weekdayShort(date){return date.toLocaleDateString("en-GB",{weekday:"short"});}function monthLabel(monthValue){const[y,m]=monthValue.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});}function labelRole(role){const labels={sno:"Senior Nursing Officer",charge_nurse:"Charge Nurse",senior_staff_nurse:"Senior Staff Nurse",nurse:"Staff Nurse",nursing_aide:"Nursing Aide",healthcare_assistant:"Nursing Aide",carer:"Carer"};return labels[role]||role||"";}function roleSortOrder(role){const order={sno:0,charge_nurse:1,senior_staff_nurse:2,nurse:3,nursing_aide:4,healthcare_assistant:4,carer:5};return order[role]??99;}function reasonForShift(code){const clean=normaliseRosterCode(code),map={AL:"annual_leave",L:"annual_leave",SL:"sick_leave",ML:"maternity_leave",ST:"study_leave",TI:"til_in",TO:"til_out",OT:"overtime",O:"off",R:"rest",D:"manual_day_change",N:"manual_night_change",M:"manual_morning_change",E:"manual_evening_change"};return map[clean]||"manual_roster_change";}function numberValue(value){const n=Number(value);return Number.isFinite(n)?n:0;}function truthy(value){return value===true||value==="true"||value===1||value==="1";}function safeKey(value){return String(value||"").replace(/[^a-zA-Z0-9]/g,"_");}function showError(message){document.getElementById("message").innerHTML=`<div class="error">${escapeHtml(message)}</div>`;}function showSuccess(message){document.getElementById("message").innerHTML=`<div class="success-msg">${escapeHtml(message)}</div>`;}function clearMessage(){const el=document.getElementById("message");if(el)el.innerHTML="";}function setLoginMessage(html){document.getElementById("loginMessage").innerHTML=html;}function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
