<!-- =========================================================
     MDH SURGICAL STAFFING
     MONTHLY ROSTER COMPACT BOXED GRID PATCH
     Paste this full block just before </body>
     ========================================================= -->

<style id="mdh-monthly-roster-compact-grid-style">
  :root {
    --mdh-roster-staff-col-width: 132px;
    --mdh-roster-date-col-width: 27px;
    --mdh-roster-header-height: 34px;
    --mdh-roster-cell-height: 34px;
    --mdh-roster-border: #cbd5e1;
    --mdh-roster-border-strong: #94a3b8;
    --mdh-roster-header-bg: #f1f5f9;
    --mdh-roster-staff-bg: #f8fafc;
    --mdh-roster-hover-bg: #eef6ff;
    --mdh-roster-selected-bg: #ecfdf5;
    --mdh-roster-selected-border: #0f766e;
  }

  /* Main compact roster table */
  table.mdh-monthly-roster-compact {
    width: max-content !important;
    min-width: max-content !important;
    max-width: none !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
    border-spacing: 0 !important;
    background: #ffffff !important;
    border: 1px solid var(--mdh-roster-border-strong) !important;
    font-size: 11px !important;
  }

  /* Make the parent area scroll only if needed */
  .mdh-monthly-roster-scroll {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    overflow-y: visible !important;
    padding-bottom: 8px !important;
  }

  /* Staff member column */
  table.mdh-monthly-roster-compact th:first-child,
  table.mdh-monthly-roster-compact td:first-child {
    width: var(--mdh-roster-staff-col-width) !important;
    min-width: var(--mdh-roster-staff-col-width) !important;
    max-width: var(--mdh-roster-staff-col-width) !important;
    padding: 5px 7px !important;
    text-align: left !important;
    vertical-align: middle !important;
    white-space: normal !important;
    word-break: normal !important;
    overflow-wrap: anywhere !important;
    border: 1px solid var(--mdh-roster-border) !important;
    background: var(--mdh-roster-staff-bg) !important;
    color: #0f172a !important;
    position: sticky !important;
    left: 0 !important;
    z-index: 4 !important;
  }

  table.mdh-monthly-roster-compact th:first-child {
    z-index: 6 !important;
    font-size: 10px !important;
    font-weight: 800 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.03em !important;
    background: #e2e8f0 !important;
  }

  /* Date headers */
  table.mdh-monthly-roster-compact th:not(:first-child) {
    width: var(--mdh-roster-date-col-width) !important;
    min-width: var(--mdh-roster-date-col-width) !important;
    max-width: var(--mdh-roster-date-col-width) !important;
    height: var(--mdh-roster-header-height) !important;
    padding: 2px 1px !important;
    text-align: center !important;
    vertical-align: middle !important;
    white-space: normal !important;
    border: 1px solid var(--mdh-roster-border) !important;
    background: var(--mdh-roster-header-bg) !important;
    color: #334155 !important;
    font-size: 9px !important;
    font-weight: 800 !important;
    line-height: 1.05 !important;
  }

  /* Date body cells */
  table.mdh-monthly-roster-compact td:not(:first-child) {
    width: var(--mdh-roster-date-col-width) !important;
    min-width: var(--mdh-roster-date-col-width) !important;
    max-width: var(--mdh-roster-date-col-width) !important;
    height: var(--mdh-roster-cell-height) !important;
    padding: 1px !important;
    text-align: center !important;
    vertical-align: middle !important;
    white-space: nowrap !important;
    border: 1px solid var(--mdh-roster-border) !important;
    background: #ffffff;
    color: #0f172a !important;
    font-size: 10px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    box-sizing: border-box !important;
  }

  /* Strong horizontal row separation */
  table.mdh-monthly-roster-compact tbody tr {
    border-bottom: 1px solid var(--mdh-roster-border-strong) !important;
  }

  /* Staff name formatting */
  table.mdh-monthly-roster-compact td:first-child strong,
  table.mdh-monthly-roster-compact td:first-child b {
    display: block !important;
    font-size: 10.5px !important;
    line-height: 1.1 !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    margin-bottom: 2px !important;
  }

  table.mdh-monthly-roster-compact td:first-child small,
  table.mdh-monthly-roster-compact td:first-child span {
    font-size: 9px !important;
    line-height: 1.1 !important;
  }

  /* Make shift values look like small centered codes */
  table.mdh-monthly-roster-compact td:not(:first-child) > * {
    margin-left: auto !important;
    margin-right: auto !important;
  }

  table.mdh-monthly-roster-compact .shift-code,
  table.mdh-monthly-roster-compact .shift-badge,
  table.mdh-monthly-roster-compact .roster-code,
  table.mdh-monthly-roster-compact .badge,
  table.mdh-monthly-roster-compact td:not(:first-child) span,
  table.mdh-monthly-roster-compact td:not(:first-child) button {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    min-width: 18px !important;
    width: 18px !important;
    height: 18px !important;
    padding: 0 !important;
    border-radius: 5px !important;
    font-size: 9px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    text-align: center !important;
  }

  /* Weekend columns */
  table.mdh-monthly-roster-compact th.mdh-weekend-cell,
  table.mdh-monthly-roster-compact td.mdh-weekend-cell {
    background: #f8fafc !important;
  }

  /* Today / selected / clicked cell */
  table.mdh-monthly-roster-compact th.mdh-today-cell,
  table.mdh-monthly-roster-compact td.mdh-today-cell,
  table.mdh-monthly-roster-compact th.today,
  table.mdh-monthly-roster-compact td.today,
  table.mdh-monthly-roster-compact th.selected,
  table.mdh-monthly-roster-compact td.selected {
    background: var(--mdh-roster-selected-bg) !important;
    outline: 2px solid var(--mdh-roster-selected-border) !important;
    outline-offset: -2px !important;
  }

  /* Hover: follow the staff row */
  table.mdh-monthly-roster-compact tbody tr:hover td {
    background: var(--mdh-roster-hover-bg) !important;
  }

  table.mdh-monthly-roster-compact tbody tr:hover td:first-child {
    background: #dbeafe !important;
  }

  /* Hover: follow the date column */
  table.mdh-monthly-roster-compact .mdh-column-hover {
    background: #fefce8 !important;
  }

  table.mdh-monthly-roster-compact tbody tr:hover .mdh-column-hover {
    background: #e0f2fe !important;
  }

  /* Clean two-line day/date header */
  table.mdh-monthly-roster-compact .mdh-day-name {
    display: block !important;
    font-size: 8px !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    color: #475569 !important;
  }

  table.mdh-monthly-roster-compact .mdh-day-number {
    display: block !important;
    font-size: 10px !important;
    font-weight: 900 !important;
    line-height: 1.1 !important;
    color: #0f172a !important;
    margin-top: 2px !important;
  }

  /* Compact legend above roster */
  .roster-legend,
  .monthly-roster-legend,
  .legend-row,
  .legend,
  .shift-legend {
    gap: 4px !important;
    padding: 5px 7px !important;
    flex-wrap: wrap !important;
  }

  .roster-legend *,
  .monthly-roster-legend *,
  .legend-row *,
  .legend *,
  .shift-legend * {
    font-size: 10px !important;
    line-height: 1.1 !important;
  }

  /* Reduce empty space around monthly roster section */
  .monthly-roster-card,
  .roster-card,
  .card:has(table.mdh-monthly-roster-compact) {
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  /* Smaller screens */
  @media (max-width: 1300px) {
    :root {
      --mdh-roster-staff-col-width: 124px;
      --mdh-roster-date-col-width: 25px;
      --mdh-roster-header-height: 32px;
      --mdh-roster-cell-height: 32px;
    }

    table.mdh-monthly-roster-compact th:not(:first-child) {
      font-size: 8px !important;
    }

    table.mdh-monthly-roster-compact td:not(:first-child) {
      font-size: 9px !important;
    }
  }

  @media print {
    table.mdh-monthly-roster-compact {
      width: 100% !important;
      min-width: 0 !important;
      table-layout: fixed !important;
      font-size: 8px !important;
    }

    table.mdh-monthly-roster-compact th:first-child,
    table.mdh-monthly-roster-compact td:first-child {
      position: static !important;
      width: 110px !important;
      min-width: 110px !important;
      max-width: 110px !important;
    }

    table.mdh-monthly-roster-compact th:not(:first-child),
    table.mdh-monthly-roster-compact td:not(:first-child) {
      width: 22px !important;
      min-width: 22px !important;
      max-width: 22px !important;
      height: 24px !important;
      font-size: 7px !important;
    }
  }
</style>

<script id="mdh-monthly-roster-compact-grid-script">
  (function () {
    function normaliseText(value) {
      return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
    }

    function isMonthlyRosterTable(table) {
      if (!table) return false;

      const text = normaliseText(table.innerText);
      const headers = Array.from(table.querySelectorAll("th")).map(function (th) {
        return normaliseText(th.innerText);
      });

      const hasStaffHeader = headers.some(function (h) {
        return h.includes("staff member") || h === "staff";
      });

      const hasManyColumns =
        table.rows &&
        table.rows.length > 0 &&
        table.rows[0].cells &&
        table.rows[0].cells.length >= 20;

      const hasDateHeader = headers.some(function (h) {
        return /^(mon|tue|wed|thu|fri|sat|sun)\s+\d{1,2}$/i.test(h);
      });

      const pageLooksMonthlyRoster =
        normaliseText(document.body.innerText).includes("monthly roster");

      return pageLooksMonthlyRoster && hasStaffHeader && hasManyColumns && (hasDateHeader || text.includes("charge nurse"));
    }

    function wrapTableForScroll(table) {
      const parent = table.parentElement;
      if (!parent) return;

      if (parent.classList.contains("mdh-monthly-roster-scroll")) return;

      const wrapper = document.createElement("div");
      wrapper.className = "mdh-monthly-roster-scroll";

      parent.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    }

    function formatHeaderCell(th, index) {
      if (!th || index === 0) return;

      const raw = th.textContent.replace(/\s+/g, " ").trim();
      const match = raw.match(/^(MON|TUE|WED|THU|FRI|SAT|SUN)\s+(\d{1,2})$/i);

      if (!match) return;

      const dayName = match[1].toUpperCase();
      const dayNumber = match[2];

      th.innerHTML =
        '<span class="mdh-day-name">' +
        dayName +
        '</span><span class="mdh-day-number">' +
        dayNumber +
        "</span>";

      if (dayName === "SAT" || dayName === "SUN") {
        th.classList.add("mdh-weekend-cell");
      }
    }

    function markWeekendBodyCells(table) {
      const headerCells = Array.from(table.querySelectorAll("thead th, tr:first-child th"));
      const weekendIndexes = [];

      headerCells.forEach(function (th, index) {
        const text = normaliseText(th.innerText);
        if (text.includes("sat") || text.includes("sun")) {
          weekendIndexes.push(index);
        }
      });

      if (!weekendIndexes.length) return;

      Array.from(table.rows).forEach(function (row) {
        weekendIndexes.forEach(function (index) {
          if (row.cells[index]) {
            row.cells[index].classList.add("mdh-weekend-cell");
          }
        });
      });
    }

    function addColumnHover(table) {
      if (table.dataset.mdhColumnHoverReady === "yes") return;
      table.dataset.mdhColumnHoverReady = "yes";

      table.addEventListener("mouseover", function (event) {
        const cell = event.target.closest("td, th");
        if (!cell || !table.contains(cell)) return;

        const columnIndex = cell.cellIndex;

        table.querySelectorAll(".mdh-column-hover").forEach(function (oldCell) {
          oldCell.classList.remove("mdh-column-hover");
        });

        if (columnIndex <= 0) return;

        Array.from(table.rows).forEach(function (row) {
          if (row.cells[columnIndex]) {
            row.cells[columnIndex].classList.add("mdh-column-hover");
          }
        });
      });

      table.addEventListener("mouseleave", function () {
        table.querySelectorAll(".mdh-column-hover").forEach(function (oldCell) {
          oldCell.classList.remove("mdh-column-hover");
        });
      });
    }

    function applyCompactRosterGrid() {
      const tables = Array.from(document.querySelectorAll("table"));

      tables.forEach(function (table) {
        if (!isMonthlyRosterTable(table)) return;

        table.classList.add("mdh-monthly-roster-compact");

        wrapTableForScroll(table);

        const firstRow = table.rows && table.rows.length ? table.rows[0] : null;
        if (firstRow) {
          Array.from(firstRow.cells).forEach(function (cell, index) {
            if (cell.tagName.toLowerCase() === "th") {
              formatHeaderCell(cell, index);
            }
          });
        }

        markWeekendBodyCells(table);
        addColumnHover(table);
      });
    }

    document.addEventListener("DOMContentLoaded", applyCompactRosterGrid);
    window.addEventListener("load", applyCompactRosterGrid);

    const observer = new MutationObserver(function () {
      applyCompactRosterGrid();
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });

    setInterval(applyCompactRosterGrid, 1500);
  })();
</script>
